
name: Compiler Game Boy TrueColor

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4

      - name: Installer les outils Android
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extraire notre application
        run: unzip -q -o GBTrueColorCamera-projet.zip -d source

      - name: Compiler APK
        working-directory: source
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Sauvegarder APK
        uses: actions/upload-artifact@v4
        with:
          name: GameBoyTrueColor-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
